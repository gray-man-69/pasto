name: Water reminders

on:
  schedule:
    # Hourly on purpose: GitHub delays/skips scheduled runs, so a 2-hourly cron
    # degrades to ~4-hourly in practice. The sender only sends on even LOCAL
    # hours, keeping the every-2-hours cadence per user.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test push to all enabled subscribers now"
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reminders
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node send.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          TEST_MODE: ${{ inputs.test }}
